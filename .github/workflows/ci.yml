name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP dependency for smoke tests
        run: python3 -m pip install mcp

      - name: Validate template
        run: python3 tools/specnative.py validate --target Template-Project-Agents-AI

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python3 -m py_compile install.py tools/specnative.py tools/specnative_mcp.py

      - name: Smoke test MCP server CLI
        run: python3 tools/specnative_mcp.py --help

      - name: Parse release workflow
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'
