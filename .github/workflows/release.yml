name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate template
        run: python3 tools/specnative.py validate

      - name: Prepare assets
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          sed "s/VERSION = \"dev\"/VERSION = \"${VERSION}\"/" install.py \
            > /tmp/install.py
          sed "s/VERSION = \"dev\"/VERSION = \"${VERSION}\"/" tools/specnative_mcp.py \
            > /tmp/specnative_mcp.py

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${VERSION}" /tmp/install.py --clobber
          gh release upload "${VERSION}" /tmp/specnative_mcp.py --clobber
