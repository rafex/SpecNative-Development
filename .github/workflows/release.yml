name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate template and run tests
        run: |
          python3 tools/specnative.py validate --target Template-Project-Agents-AI
          python3 tools/sync_agent_commands.py --check
          python3 -m py_compile install.py tools/specnative.py tools/specnative_mcp.py tools/sync_agent_commands.py
          python3 -m unittest discover -s tests -v

      - name: Prepare release assets
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          replacements = {
              "install.py": "dist/install.py",
              "tools/specnative_mcp.py": "dist/specnative_mcp.py",
          }
          for source, destination in replacements.items():
              content = Path(source).read_text(encoding="utf-8")
              content = content.replace('VERSION = "dev"', f'VERSION = "{version}"', 1)
              Path(destination).write_text(content, encoding="utf-8")
          PY

      - name: Smoke test release assets
        run: |
          python3 -m pip install "mcp>=1.0,<2.0"
          python3 dist/install.py --help
          python3 -m py_compile dist/install.py dist/specnative_mcp.py
          python3 dist/specnative_mcp.py --help

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${VERSION}" \
            dist/install.py \
            dist/specnative_mcp.py \
            --clobber

  update-readme:
    needs: release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update README version references
        env:
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_URL: https://github.com/rafex/SpecNative-Development/releases/tag/${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          release_url = os.environ["RELEASE_URL"]
          minor = ".".join(version.lstrip("v").split(".")[:2])

          def update_readme(path: str, row: str, language: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if language == "en":
                  text = re.sub(
                      r"\*\*Current Release:\*\* \[v[\d.]+\]\([^)]+\)(\s*<!--[^>]*-->)?",
                      f"**Current Release:** [{version}]({release_url}) <!-- CURRENT_RELEASE -->",
                      text,
                  )
              text = re.sub(
                  r"((?:MCP server|Servidor MCP)[^`]*`[^`]+`[^(]*\(v)[\d.]+(\)\s*<!--[^>]*-->)",
                  rf"\g<1>{minor}\2",
                  text,
              )
              if version not in text:
                  text = text.replace("<!-- END_VERSIONS -->", f"{row}\n<!-- END_VERSIONS -->")
              file.write_text(text, encoding="utf-8")

          update_readme(
              "README.md",
              f"| **{version}** | [Release notes]({release_url}) |",
              "en",
          )
          update_readme(
              "README.es.md",
              f"| **{version}** | [Notas de la versión]({release_url}) |",
              "es",
          )
          PY

      - name: Commit and push README updates
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md
          if git diff --staged --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "docs: update README to ${VERSION} [skip ci]"
            git push origin main
          fi
