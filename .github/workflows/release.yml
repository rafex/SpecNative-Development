name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate template
        run: python3 tools/specnative.py validate

      - name: Prepare installer
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          sed "s/VERSION = \"dev\"/VERSION = \"${VERSION}\"/" install.py \
            > install_release.py

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${VERSION}" install_release.py#install.py \
            --clobber
